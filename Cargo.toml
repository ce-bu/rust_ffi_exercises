[package]
name = "rust-ffi-exercises"
version = "0.1.0"
edition = "2021"
description = "Hands-on Rust FFI exercises — implement the TODO stubs, then run `cargo test`"

[lib]
name = "rust_ffi_exercises"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
cc = "1"

[dependencies]
libc = "0.2"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
] }
